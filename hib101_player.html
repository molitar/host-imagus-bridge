<!doctype html><html lang="en" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="hib101_player.css"></head><body><main id="player"><video id="media" playsinline preload="auto"></video><div id="hib-ass-layer" aria-label="ASS subtitles"></div><div id="message" role="status">Preparing player…</div><section id="controls" translate="no" class="notranslate"><button id="play" aria-label="Play or pause">▶</button><span id="current" translate="no" class="notranslate">0:00</span><div id="seekWrap"><div id="bufferTrack" aria-hidden="true"><div id="playedRange"></div><div id="bufferedRange"></div></div><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"></div><span id="duration" translate="no" class="notranslate">0:00</span><button id="mute" aria-label="Mute">🔊</button><input type="range" id="volume" min="0" max="100" value="100" step="1" aria-label="Volume"><output id="volumeLabel">100%</output><button id="captionSmaller" title="Smaller subtitles" aria-label="Decrease subtitle size">A−</button><button id="captionLarger" title="Larger subtitles" aria-label="Increase subtitle size">A+</button><button id="captions" aria-label="Toggle subtitles" hidden>CC</button><button id="fullscreen" aria-label="Fullscreen">⛶</button></section></main><script src="hls.min.js"></script><script src="dash.all.min.js"></script><script src="hib_libass_controller.js"></script><script src="hib_ass.js"></script><script src="hib_mp4fix.js"></script><script src="hib101_player.js"></script></body></html>
